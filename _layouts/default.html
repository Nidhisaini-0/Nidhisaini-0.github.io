<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >

</head>

<body>

  <header class="site-header">

    <div class="nav-container">

      <a
        href="{{ '/' | relative_url }}"
        class="logo"
      >
        {{ site.title }}
      </a>

      <nav class="nav-links">

        <a href="{{ '/' | relative_url }}">
          Home
        </a>

        <a href="{{ '/categories/' | relative_url }}">
          Categories
        </a>

        <a href="{{ '/tags/' | relative_url }}">
          Tags
        </a>

        <a href="{{ '/about/' | relative_url }}">
          About
        </a>

      </nav>

    </div>

  </header>


  <main class="container">

    {{ content }}

  </main>


  <footer class="site-footer">

    <div class="footer-container">

      <div class="footer-text">
        © {{ site.time | date: "%Y" }} {{ site.author }}
      </div>

      <div class="footer-text">
        Built with GitHub Pages
      </div>

    </div>

  </footer>


  <script
    src="{{ '/assets/js/main.js' | relative_url }}"
  ></script>

</body>

</html>
